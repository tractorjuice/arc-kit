      <path d="M0,0 L80,54 M80,0 L0,54" stroke="#ffffff" stroke-width="12"/>
      <path d="M0,0 L80,54 M80,0 L0,54" stroke="#C8102E" stroke-width="6"/>
      <path d="M40,0 V54 M0,27 H80" stroke="#ffffff" stroke-width="19"/>
