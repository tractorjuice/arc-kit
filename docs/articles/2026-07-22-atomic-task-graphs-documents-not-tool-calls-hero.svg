<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b6b93"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="#07111f"/>

  <!-- Title -->
  <text x="72" y="112" fill="#f8fafc" font-family="Arial, sans-serif" font-size="56" font-weight="700">Atomic Task Graphs</text>
  <text x="74" y="158" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="30">for documents, not tool calls</text>

  <!-- Wave labels -->
  <g fill="#64748b" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">
    <text x="180" y="210">WAVE 0</text>
    <text x="390" y="210">WAVE 1</text>
    <text x="600" y="210">WAVE 2</text>
    <text x="810" y="210">WAVE 3</text>
    <text x="1020" y="210">WAVE 4</text>
  </g>

  <!-- Dependency edges (topological waves) -->
  <g stroke="#334f6b" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="268" y1="328" x2="300" y2="278"/>
    <line x1="268" y1="328" x2="300" y2="378"/>
    <line x1="478" y1="278" x2="510" y2="258"/>
    <line x1="478" y1="278" x2="510" y2="358"/>
    <line x1="478" y1="378" x2="510" y2="358"/>
    <line x1="688" y1="258" x2="720" y2="328"/>
    <line x1="688" y1="358" x2="720" y2="328"/>
  </g>
  <!-- Staleness cascade reaching Traceability -->
  <line x1="898" y1="328" x2="930" y2="328" stroke="#fbbf24" stroke-width="2.5" fill="none" marker-end="url(#arrowAmber)"/>

  <!-- Nodes -->
  <g font-family="Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle">
    <g>
      <rect x="92" y="306" width="176" height="44" rx="10" fill="#0b1f33" stroke="#7dd3fc" stroke-width="2"/>
      <text x="180" y="334" fill="#e2e8f0">Principles</text>
    </g>
    <g>
      <rect x="302" y="256" width="176" height="44" rx="10" fill="#0b1f33" stroke="#7dd3fc" stroke-width="2"/>
      <text x="390" y="284" fill="#e2e8f0">Requirements</text>
    </g>
    <g>
      <rect x="302" y="356" width="176" height="44" rx="10" fill="#0b1f33" stroke="#7dd3fc" stroke-width="2"/>
      <text x="390" y="384" fill="#e2e8f0">Stakeholders</text>
    </g>
    <g>
      <rect x="512" y="236" width="176" height="44" rx="10" fill="#0b1f33" stroke="#7dd3fc" stroke-width="2"/>
      <text x="600" y="264" fill="#e2e8f0">Risk Register</text>
    </g>
    <g>
      <rect x="512" y="336" width="176" height="44" rx="10" fill="#0b1f33" stroke="#7dd3fc" stroke-width="2"/>
      <text x="600" y="364" fill="#e2e8f0">High-Level Design</text>
    </g>
    <g>
      <rect x="722" y="306" width="176" height="44" rx="10" fill="#0b1f33" stroke="#7dd3fc" stroke-width="2"/>
      <text x="810" y="334" fill="#e2e8f0">Business Case</text>
    </g>
    <!-- Stale node -->
    <g>
      <rect x="932" y="306" width="176" height="44" rx="10" fill="#2a1a08" stroke="#fbbf24" stroke-width="2"/>
      <text x="1020" y="334" fill="#fde68a">Traceability Matrix</text>
    </g>
  </g>
  <text x="1020" y="372" fill="#fbbf24" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="700">stale &#8635; rebuild</text>

  <!-- Tagline -->
  <text x="72" y="562" fill="#7dd3fc" font-family="Arial, sans-serif" font-size="30" font-weight="700">The graph is the product.</text>
  <text x="74" y="597" fill="#94a3b8" font-family="Arial, sans-serif" font-size="19">ArcKit build harness &#183; dependency-aware &#183; wave-parallel &#183; staleness-tracked</text>
</svg>
