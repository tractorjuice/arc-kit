<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ArcKit - The Enterprise Architecture Governance Harness">
<title>ArcKit - The Enterprise Architecture Governance Harness</title>

<!-- Background -->
<rect width="1200" height="630" fill="#0B1F33" />

<!-- Subtle harness grid background -->
<g stroke="#1ED3C6" stroke-width="0.5" stroke-opacity="0.08">
  <line x1="0" y1="180" x2="1200" y2="180" />
  <line x1="0" y1="450" x2="1200" y2="450" />
  <line x1="200" y1="0" x2="200" y2="630" />
  <line x1="600" y1="0" x2="600" y2="630" />
  <line x1="1000" y1="0" x2="1000" y2="630" />
</g>

<!-- Logo group, centered horizontally, positioned upper-middle -->
<g transform="translate(380, 140)">
  <g fill="none">
    <path d="M 7.06,100.00 A 180.00,180.00 0 0 1 318.94,100.00" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" />
    <path d="M 45.11,121.00 A 136.00,136.00 0 0 1 280.89,121.00" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" />
    <g stroke="#1ED3C6" stroke-width="3.0" stroke-linecap="round" stroke-opacity="0.65">
      <line x1="48.5" y1="55.5" x2="184.0" y2="11.0" />
      <line x1="184.0" y1="11.0" x2="297.5" y2="69.0" />
      <line x1="48.5" y1="55.5" x2="297.5" y2="69.0" />
    </g>
    <line x1="75.0" y1="84.0" x2="48.5" y2="55.5" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" />
    <line x1="180.0" y1="50.0" x2="184.0" y2="11.0" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" />
    <line x1="268.0" y1="94.0" x2="297.5" y2="69.0" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" />
    <circle cx="48.5" cy="55.5" r="12.5" fill="#1ED3C6" />
    <circle cx="184.0" cy="11.0" r="12.5" fill="#1ED3C6" />
    <circle cx="297.5" cy="69.0" r="12.5" fill="#1ED3C6" />
    <line x1="155.0" y1="53.0" x2="178.0" y2="53.0" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="6.5" stroke-linecap="round" />
    <line x1="166.5" y1="42.0" x2="166.5" y2="65.0" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="6.5" stroke-linecap="round" />
  </g>
</g>

<!-- ArcKit wordmark -->
<text x="600" y="430" font-family="Inter, IBM Plex Sans, SF Pro, -apple-system, system-ui, Segoe UI, Roboto, 'Helvetica Neue', Arial, sans-serif"
font-size="120" font-weight="700" fill="#FFFFFF" letter-spacing="-1px" text-anchor="middle">ArcKit</text>

<!-- Tagline -->
<text x="600" y="490" font-family="Inter, IBM Plex Sans, SF Pro, -apple-system, system-ui, Segoe UI, Roboto, 'Helvetica Neue', Arial, sans-serif"
font-size="32" font-weight="500" fill="#1ED3C6" letter-spacing="0.5px" text-anchor="middle">The Enterprise Architecture Governance Harness</text>

<!-- Secondary line -->
<text x="600" y="540" font-family="Inter, IBM Plex Sans, SF Pro, -apple-system, system-ui, Segoe UI, Roboto, 'Helvetica Neue', Arial, sans-serif"
font-size="22" font-weight="400" fill="#B1B4B6" letter-spacing="0.3px" text-anchor="middle">Strategy · Architecture · Delivery · Assurance</text>

<!-- Footer URL -->
<text x="600" y="595" font-family="Inter, IBM Plex Sans, SF Pro, -apple-system, system-ui, Segoe UI, Roboto, 'Helvetica Neue', Arial, sans-serif"
font-size="18" font-weight="400" fill="#5A6A78" letter-spacing="0.5px" text-anchor="middle">arckit.org</text>
