    <title>The Leaf Node Problem: why your AI pilot is optimising the wrong thing | ArcKit</title>
    <meta name="description" content="Most AI pilots in large organisations are funded by a team and accountable to a team. The team has KPIs. Six months later there is a write-up showing local improvement, the pilot is declared a success, and the enterprise outcome the company actually cares about does not move. Valentine et al. (2024) named the pattern; Gonzalez picked it up as Idea 10 of Organizing Intelligence at DeepMind. The architectural shorthand is the leaf node problem — AI tooling deployed along the org chart inherits the org chart&#x27;s gravity, with three points of inertia (Team KPIs, the org chart itself, and siloed data schemas) pulling every pilot downward. Mapped on a Wardley Map, the lift is visible, and so is the cost.">
