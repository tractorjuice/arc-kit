    <title>ArcKit v5.3: The First Sector Overlay, for UK Payments | ArcKit</title>
    <meta name="description" content="ArcKit v5.3 introduces a new kind of community overlay. The seven prior community plugins cover legal territories (UAE, France, Canada, EU, Austria, Australia, USA federal civilian); arckit-uk-finance stays inside the UK but narrows to a single industry vertical, payments. Four commands cover the FCA stack for established Payment Service Providers, E-Money Institutions, and Payment Institutions: PSD2 SCA-RTS exemption design under PSRs 2017 + PS21/19, EMI/PI safeguarding under EMR 2011 + PS24/9 (CRITICAL severity), the FCA Consumer Duty annual board report under PS22/9 + FG22/5, and the Critical Third Parties dependency assessment under PS24/16 + FSMA 2023. Recipe: uk-fs-payments (4 waves, 11 targets). Ninth marketplace plugin. Total command count 135 to 139. Ships EXPERIMENTAL while a UK FS domain co-maintainer is recruited.">
