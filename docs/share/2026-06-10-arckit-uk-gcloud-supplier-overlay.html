    <meta name="description" content="ArcKit has always governed the buyer; arckit-uk-gcloud turns the harness around to face the supplier. The 13th marketplace plugin (and fourth sector overlay) drives a G-Cloud 14 Digital Marketplace submission end to end with 11 commands — supplier profile, service design, Service Definition Documents for Lots 1/2/3, pricing, NCSC Cloud Security Principles assertions, a supplier-side competitor benchmark, a completeness review and a CCS submission pack. Each service becomes its own ArcKit project (projects/{NNN}-service/) with supplier-wide docs in projects/000-global/supplier/, so /arckit:diagram, /arckit:dpia, /arckit:health and the governance dashboard all compose for free. Ported from the standalone gcloud-kit plugin; requires arckit core; Proprietary and Claude Code only.">
