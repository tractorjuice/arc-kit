    <title>How ArcKit tidies Wardley Map labels: a deterministic placement engine, stepped through | ArcKit</title>
    <meta name="description" content="ArcKit renders every Wardley Map as a Mermaid wardley-beta block, and Mermaid draws every component label at the same default offset. On a real strategic map, where related components cluster, those labels land on top of each other and the map becomes correct and unreadable at the same time. ArcKit v5 fixes this with a PostToolUse hook that rewrites the label offsets automatically. This article steps through the algorithm behind it: a pure, deterministic placement engine that projects the map to pixels, generates 32 candidate slots per label, scores each against a weighted collision penalty, places the most-constrained labels first, runs a refinement pass, and converges to an idempotent result a Write hook can run on every save.">
