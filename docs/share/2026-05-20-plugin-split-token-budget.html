    <title>The token budget behind ArcKit&#x27;s plugin split, and how to split a plugin of your own | ArcKit</title>
    <meta name="description" content="Every architecture decision has a number behind it. The number behind ArcKit v5.0.0 came from one command, claude plugin details, which reported that the old single-plugin ArcKit added roughly 15,000 tokens to every session before the user typed anything. A third of that was jurisdictional compliance for countries the user would never work in. This article reads that receipt in full: where the always-on cost goes, why agents dominate the core figure while overlay command descriptions cost three times what core commands do, and how splitting into seven marketplace plugins cut a single-jurisdiction user&#x27;s always-on footprint by about 34 percent. It closes with an eight-step guide to splitting a monolithic plugin of your own.">
