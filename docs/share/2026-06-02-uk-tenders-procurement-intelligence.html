    <title>ArcKit v5.9.0: Procurement Market Intelligence from Real Award Data | ArcKit</title>
    <meta name="description" content="ArcKit v5.9.0 adds two commands and a new bundled MCP service that ground procurement and assurance work in real UK contract award data. /arckit:tenders produces a Procurement Market Intelligence artefact (award-value benchmarks, top suppliers, incumbency and supplier concentration) for a capability, CPV code or buyer; /arckit:competitors maps the supplier-rivalry view and writes a government award history into each vendor profile. Both share one secure, untrusted-input reader over the new UK Tenders MCP, which indexes around 677,000 UK contracting processes across all five national portals (Find a Tender, Contracts Finder, Public Contracts Scotland, Sell2Wales, eTendersNI) under OGL v3.0, with the official notice URL on every record. The evidence then flows into risk (supplier-concentration risk), sobc (Economic Case market context), research (build vs buy) and score (vendor company experience), carrying the caveat throughout that awarded value is not actual spend.">
