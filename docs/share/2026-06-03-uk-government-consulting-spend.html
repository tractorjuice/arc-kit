    <title>Britain&#x27;s War on Consultants: What the Procurement Data Actually Shows | ArcKit</title>
    <meta name="description" content="We pointed ArcKit&#x27;s new /arckit:tenders command at 677,000 UK contract notices to settle a contested question: what does UK government really spend on consulting, and did the 2023 cost-cutting drive work? The most-quoted management-consultancy figure, £18.7bn, turns out to be roughly 70 percent framework ceilings and mis-codes; the genuine run-rate is about £0.7bn a year, or £1.9bn including IT and research advisory, which reconciles with the NAO&#x27;s £1.36bn central-government figure and Tussell&#x27;s record £3.7bn whole-public-sector total. The award data shows consulting rose every year through the cost-cutting drive to a 2024/25 peak, then fell for the first time in 2025, with the caveat throughout that awarded value is not actual spend. Three charts, no tables.">
