# ArcKit build recipe — baseline (neutral, jurisdiction-free)
#
# Recipe schema v1. Loaded by the arckit-build skill at runtime.
#
# Override this file by creating .arckit/recipes/baseline.yaml at the project
# root. The harness checks the project override first, then falls back to this
# default.
#
# Variable substitution applied by the orchestrator before passing args to
# worker subagents:
#   {P}     ← project ID, zero-padded (e.g. "001")
#   {NAME}  ← project slug (e.g. "arckit-saas")
#   {V}     ← defaults.version
#   {TOPIC} ← target.topic (multi-instance ADR/DIAG topics)

recipe: baseline
schema_version: 1
description: >
  Neutral ArcKit governance baseline — strategy, architecture, delivery,
  and assurance artefacts with no jurisdiction-specific compliance. Layer a
  jurisdiction overlay (arckit-uk, arckit-au, arckit-us, ...) for regional
  compliance recipes.

defaults:
  version: "1.0"

# Optional targets are skipped unless explicitly enabled.
# - default: true → built unless excluded with --exclude {ID}
# - default: false (or absent) → built only with --enable {ID}
optional_targets:
  # Research wave (default-on, opt-out with --exclude). All research
  # outputs land in research/ subfolders. ORG_RESEARCH writes to
  # projects/000-global/research/ so the org context is shared across
  # every project in the repo. Other research targets are per-project.
  ORG_RESEARCH:
    description: Target organisation research — strategy, structure, existing systems. Output to projects/000-global/research/. Run before any project-specific work so subsequent technology research and ADRs inherit the org context.
    default: true
  RESEARCH:
    description: Technology and vendor market research (build vs buy, TCO)
    default: true
  AWS_RESEARCH:
    description: AWS service availability and architecture patterns (skip with --exclude AWS_RESEARCH if AWS not in scope)
    default: true
  AZURE_RESEARCH:
    description: Azure service availability and architecture patterns (skip with --exclude AZURE_RESEARCH if Azure not in scope)
    default: true
  GCP_RESEARCH:
    description: Google Cloud service availability and architecture patterns (skip with --exclude GCP_RESEARCH if GCP not in scope)
    default: true
  DATASCOUT:
    description: External data source discovery (APIs, datasets, open data portals) — only when REQ specifies external data ingestion
    default: false

# Hooks run after the final target wave, in parallel.
post_build_hooks:
  - skill: arckit:health
    args: ""
  - skill: arckit:pages
    args: ""

# ---------------------------------------------------------------------------
# Targets
# ---------------------------------------------------------------------------
# Each target is one ArcKit artefact. The orchestrator topo-sorts by `deps`
# and dispatches one worker subagent per target per wave.
#
# Fields:
#   id              Unique target identifier (used in deps lists and state.json)
#   skill           ArcKit skill to invoke (e.g. arckit:requirements)
#   args            Args passed to the skill, after {P}/{NAME}/{V} substitution
#   output.project  Project directory: "000-global" or "{P}-{NAME}"
#   output.type     ArcKit doc-type code passed to generate-document-id.sh
#   output.subfolder           (optional) subfolder relative to project dir
#   output.multi_instance      (optional) true → requires --next-num when
#                              invoking generate-document-id.sh
#   topic           (optional) Used in commit messages and state.json for
#                   multi-instance targets where the ID alone isn't descriptive
#   deps            List of target IDs that must complete first
# ---------------------------------------------------------------------------

targets:

  # --- Wave 0 / 1: foundational ------------------------------------------
  - id: PRIN
    skill: arckit:principles
    args: ""
    output: { project: "000-global", type: PRIN }
    deps: []

  - id: GLOSSARY
    skill: arckit:glossary
    args: "{P}"
    output: { project: "000-global", type: GLO }
    deps: [PRIN]

  - id: REQ
    skill: arckit:requirements
    args: "{NAME}"
    output: { project: "{P}-{NAME}", type: REQ }
    deps: [PRIN]

  - id: STKE
    skill: arckit:stakeholders
    args: "{NAME}"
    output: { project: "{P}-{NAME}", type: STKE }
    deps: [PRIN]

  # --- Research wave (default-on, parallel, before ADRs) ----------------
  # Org research runs first (no deps) and writes to 000-global so every
  # project in the repo inherits the same target-organisation context.
  # Per-project technology research depends on the org research being
  # in place plus REQ being known.
  - id: ORG_RESEARCH
    skill: arckit:research
    topic: "Target organisation strategy, structure, and existing systems"
    args: "{NAME} target-organisation strategy structure existing-systems"
    output: { project: "000-global", type: RSCH, subfolder: research, multi_instance: true }
    deps: []

  - id: RESEARCH
    skill: arckit:research
    topic: "Technology and vendor market research (build vs buy, TCO)"
    args: "{P}"
    output: { project: "{P}-{NAME}", type: RSCH, subfolder: research, multi_instance: true }
    deps: [REQ, ORG_RESEARCH]

  - id: AWS_RESEARCH
    skill: arckit:aws-research
    args: "{P}"
    output: { project: "{P}-{NAME}", type: AWRS, subfolder: research, multi_instance: true }
    topic: "AWS service availability + architecture patterns"
    deps: [REQ, ORG_RESEARCH]

  - id: AZURE_RESEARCH
    skill: arckit:azure-research
    args: "{P}"
    output: { project: "{P}-{NAME}", type: AZRS, subfolder: research, multi_instance: true }
    topic: "Azure service availability + architecture patterns"
    deps: [REQ, ORG_RESEARCH]

  - id: GCP_RESEARCH
    skill: arckit:gcp-research
    args: "{P}"
    output: { project: "{P}-{NAME}", type: GCRS, subfolder: research, multi_instance: true }
    topic: "Google Cloud service availability + architecture patterns"
    deps: [REQ, ORG_RESEARCH]

  - id: DATASCOUT
    skill: arckit:datascout
    args: "{P}"
    output: { project: "{P}-{NAME}", type: DSCT, subfolder: research, multi_instance: true }
    topic: "External data source discovery (APIs, datasets, open data)"
    deps: [REQ, ORG_RESEARCH]

  # --- ADR set (parallel, all share deps) --------------------------------
  - id: ADR-001
    skill: arckit:adr
    topic: "Cloud platform selection"
    args: "{P} {TOPIC}"
    output: { project: "{P}-{NAME}", type: ADR, subfolder: decisions, multi_instance: true }
    deps: [PRIN, REQ]

  - id: ADR-002
    skill: arckit:adr
    topic: "Identity and access management"
    args: "{P} {TOPIC}"
    output: { project: "{P}-{NAME}", type: ADR, subfolder: decisions, multi_instance: true }
    deps: [PRIN, REQ]

  - id: ADR-003
    skill: arckit:adr
    topic: "Data residency and sovereignty"
    args: "{P} {TOPIC}"
    output: { project: "{P}-{NAME}", type: ADR, subfolder: decisions, multi_instance: true }
    deps: [PRIN, REQ]

  - id: ADR-004
    skill: arckit:adr
    topic: "AI / LLM provider (if AI feature in scope)"
    args: "{P} {TOPIC}"
    output: { project: "{P}-{NAME}", type: ADR, subfolder: decisions, multi_instance: true }
    deps: [PRIN, REQ]

  - id: ADR-005
    skill: arckit:adr
    topic: "Logging and observability stack"
    args: "{P} {TOPIC}"
    output: { project: "{P}-{NAME}", type: ADR, subfolder: decisions, multi_instance: true }
    deps: [PRIN, REQ]

  - id: ADR-006
    skill: arckit:adr
    topic: "Deployment topology (regions, multi-tenancy)"
    args: "{P} {TOPIC}"
    output: { project: "{P}-{NAME}", type: ADR, subfolder: decisions, multi_instance: true }
    deps: [PRIN, REQ]

  - id: ADR-007
    skill: arckit:adr
    topic: "Build vs buy"
    args: "{P} {TOPIC}"
    output: { project: "{P}-{NAME}", type: ADR, subfolder: decisions, multi_instance: true }
    deps: [PRIN, REQ]

  - id: ADR-008
    skill: arckit:adr
    topic: "Open-source licence policy"
    args: "{P} {TOPIC}"
    output: { project: "{P}-{NAME}", type: ADR, subfolder: decisions, multi_instance: true }
    deps: [PRIN, REQ]

  # --- Strategic / global outputs ---------------------------------------
  - id: STRATEGY
    skill: arckit:strategy
    args: ""
    output: { project: "000-global", type: STRAT }
    deps: [PRIN, STKE]

  - id: WARDLEY
    skill: arckit:wardley
    args: "{NAME}"
    output: { project: "000-global", type: WARD }
    deps: [PRIN, REQ]

  # --- Risk + assurance --------------------------------------------------
  - id: RISK
    skill: arckit:risk
    args: "{P}"
    output: { project: "{P}-{NAME}", type: RISK }
    deps: [REQ, STKE, "ADR-*", PRIN]

  - id: HLD
    skill: arckit:hld-review
    args: "{P}"
    output: { project: "{P}-{NAME}", type: HLDR }
    deps: [REQ, "ADR-*", PRIN]

  - id: SOBC
    skill: arckit:sobc
    args: "{P}"
    output: { project: "{P}-{NAME}", type: SOBC }
    deps: [REQ, STKE, RISK]

  # --- Diagrams (multi-instance, pre-allocated topics) ------------------
  - id: DIAG-C4
    skill: arckit:diagram
    topic: "c4-context"
    args: "{P} {TOPIC}"
    output: { project: "{P}-{NAME}", type: DIAG, subfolder: diagrams, multi_instance: true }
    deps: [HLD]

  - id: DIAG-SEQ
    skill: arckit:diagram
    topic: "sequence"
    args: "{P} {TOPIC}"
    output: { project: "{P}-{NAME}", type: DIAG, subfolder: diagrams, multi_instance: true }
    deps: [HLD]

  - id: DIAG-DEP
    skill: arckit:diagram
    topic: "deployment"
    args: "{P} {TOPIC}"
    output: { project: "{P}-{NAME}", type: DIAG, subfolder: diagrams, multi_instance: true }
    deps: [HLD, ADR-006]

  # --- Operational + planning -------------------------------------------
  - id: PLAN
    skill: arckit:plan
    args: "{P}"
    output: { project: "{P}-{NAME}", type: PLAN }
    deps: [SOBC, RISK]

  - id: ROADMAP
    skill: arckit:roadmap
    args: "{P}"
    output: { project: "{P}-{NAME}", type: ROAD }
    deps: [PLAN]

  - id: DEVOPS
    skill: arckit:devops
    args: "{P}"
    output: { project: "{P}-{NAME}", type: DEVOPS }
    deps: [REQ, "ADR-*"]

  - id: FINOPS
    skill: arckit:finops
    args: "{P}"
    output: { project: "{P}-{NAME}", type: FINOPS }
    deps: [REQ, RISK]

  - id: OPS
    skill: arckit:operationalize
    args: "{P}"
    output: { project: "{P}-{NAME}", type: OPS }
    deps: [HLD, DEVOPS, RISK]

  # --- Cross-cutting last -----------------------------------------------
  - id: TRACE
    skill: arckit:traceability
    args: "{P}"
    output: { project: "{P}-{NAME}", type: TRAC }
    deps:
      [REQ, STKE, "ADR-*", RISK, HLD,
       PLAN, ROADMAP, DEVOPS, FINOPS, OPS]
