name = "arckit-cert"
main = "src/index.mjs"
compatibility_date = "2026-10-01"

[vars]
SITE_URL = "https://arckit.org"
ALLOWED_ORIGINS = "https://arckit.org"
# Retired public keys, kept so credentials signed with them still verify. Keep in step with docs/certification/jwks.json.
PUBLIC_KEYS = '{"keys":[]}'

# Per-IP limit on quiz submissions, per Cloudflare location; protects the KV write quota.
[[ratelimits]]
name = "SUBMIT_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 5
  period = 60

# IDs are printed by `npx wrangler kv namespace create …` in Task 10, Step 3.
[[kv_namespaces]]
binding = "QUESTIONS"
id = "set-in-task-10"

[[kv_namespaces]]
binding = "CREDENTIALS"
id = "set-in-task-10"
