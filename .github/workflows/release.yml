name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Generate release notes
        run: |
          PREV_TAG=$(git tag -l 'v*' --sort=-v:refname | sed -n '2p')
          ./scripts/generate-release-notes.sh "$PREV_TAG" > /tmp/release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" \
            --title "ArcKit $TAG_NAME" \
            --notes-file /tmp/release-notes.md

  # Publishing the CLI was a manual step, so it stopped happening: PyPI sat at
  # 6.4.1 while the repo was on 6.7.5, and `pip install arckit-cli` served a
  # three-release-old CLI to anyone not using the git URL (#730).
  #
  # Uses PyPI Trusted Publishing (OIDC), so there is no long-lived credential
  # to store or rotate. One-time setup on PyPI, under the project's Publishing
  # tab -> GitHub Actions, with these exact values or the exchange is rejected:
  #   Owner: tractorjuice   Repository: arc-kit
  #   Workflow: release.yml   Environment: pypi
  #
  # STATUS 2026-08-19: that setup has NOT been done, so this job has failed on
  # every release since it was added (v6.8.0, v6.9.0, v6.10.0, v6.11.0) and
  # `arckit-cli` on PyPI is still 6.4.1. The failure is:
  #
  #   Trusted publishing exchange failure:
  #   * `invalid-publisher`: valid token, but no corresponding publisher
  #
  # which means the OIDC token minted fine and PyPI has no publisher matching
  # the claims. It is a PyPI-side configuration step, not a defect in this
  # workflow, and nothing in this repository can fix it. The claims presented
  # are the four values above; they must match the PyPI entry exactly,
  # including the environment name.
  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      # Required for OIDC, and must be set at job level — the workflow-level
      # `contents: write` above does not carry it.
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        # hatch_build.py runs scripts/converter.py during the build, so the
        # generated extension trees reach the wheel even though they are
        # gitignored, and the build fails rather than shipping them empty.
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check the built version matches the tag
        # A tag disagreeing with pyproject.toml would publish under the wrong
        # number, and PyPI never lets a version be reused.
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          BUILT=$(ls dist/*.tar.gz | sed -E 's/.*arckit_cli-(.+)\.tar\.gz/\1/')
          if [ "v$BUILT" != "$TAG_NAME" ]; then
            echo "::error::Tag $TAG_NAME does not match built version $BUILT."
            echo "Run scripts/bump-version.sh before tagging."
            exit 1
          fi
          echo "Publishing arckit-cli $BUILT"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          # Makes re-running a partially failed release a no-op rather than a
          # hard failure on "file already exists".
          skip-existing: true
