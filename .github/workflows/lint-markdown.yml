name: Lint Markdown

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - ".markdownlint-cli2.jsonc"
      - ".github/workflows/lint-markdown.yml"
      - "scripts/tests/**"
      - "scripts/check_references.py"
      - "scripts/check_recipes.py"
      - "scripts/check_doctype_collisions.py"
      - "scripts/check-guide-parity.py"
      - "scripts/check-doc-type-registry.py"
      - "scripts/sync-shared-assets.py"
      - "scripts/standardise-colon.py"
      - "package.json"
      - "package-lock.json"
      - "scripts/check-guide-site-links.py"
      - "scripts/check-contributor-credits.py"
      - "scripts/check-llms-txt.py"
      - "docs/llms.txt"
      - "scripts/check-quality-checklist-refs.py"
      - "scripts/check-doc-control-resolution.py"
      - "scripts/check-common-parity.py"
      - "scripts/check-create-project-invocations.py"
      - "scripts/bash/common.sh"
      - "scripts/python/common.py"
      - "plugins/arckit-claude/scripts/bash/common.sh"
      - "plugins/arckit-claude/scripts/python/common.py"
      - "docs/contributors.html"
      - "docs/guides.html"
      - "docs/roles.html"
      - "plugins/arckit-*/recipes/**"
      - "plugins/arckit-claude/skills/arckit-build/recipes/**"
      - "plugins/arckit-claude/config/doc-types.mjs"
      - "plugins/arckit-claude/scripts/generate-document-id.mjs"
      - "scripts/bash/generate-document-id.sh"
      - "plugins/arckit-claude/scripts/bash/generate-document-id.sh"
      - "plugins/arckit-claude/.claude-plugin/plugin.json"
      - "plugins/arckit-claude/hooks/**"
      - "plugins/arckit-claude/schemas/tenders-handoff.schema.json"
      - "tests/plugin/**"
  pull_request:
    paths:
      - "**/*.md"
      - ".markdownlint-cli2.jsonc"
      - ".github/workflows/lint-markdown.yml"
      - "scripts/tests/**"
      - "scripts/check_references.py"
      - "scripts/check_recipes.py"
      - "scripts/check_doctype_collisions.py"
      - "scripts/check-guide-parity.py"
      - "scripts/check-doc-type-registry.py"
      - "scripts/sync-shared-assets.py"
      - "scripts/standardise-colon.py"
      - "package.json"
      - "package-lock.json"
      - "scripts/check-guide-site-links.py"
      - "scripts/check-contributor-credits.py"
      - "scripts/check-llms-txt.py"
      - "docs/llms.txt"
      - "scripts/check-quality-checklist-refs.py"
      - "scripts/check-doc-control-resolution.py"
      - "scripts/check-common-parity.py"
      - "scripts/check-create-project-invocations.py"
      - "scripts/bash/common.sh"
      - "scripts/python/common.py"
      - "plugins/arckit-claude/scripts/bash/common.sh"
      - "plugins/arckit-claude/scripts/python/common.py"
      - "docs/contributors.html"
      - "docs/guides.html"
      - "docs/roles.html"
      - "plugins/arckit-*/recipes/**"
      - "plugins/arckit-claude/skills/arckit-build/recipes/**"
      - "plugins/arckit-claude/config/doc-types.mjs"
      - "plugins/arckit-claude/scripts/generate-document-id.mjs"
      - "scripts/bash/generate-document-id.sh"
      - "plugins/arckit-claude/scripts/bash/generate-document-id.sh"
      - "plugins/arckit-claude/.claude-plugin/plugin.json"
      - "plugins/arckit-claude/hooks/**"
      - "plugins/arckit-claude/schemas/tenders-handoff.schema.json"
      - "tests/plugin/**"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: "**/*.md"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps for reference linter
        run: pip install pyyaml

      - name: Cross-reference linter
        run: python3 scripts/check_references.py

      - name: Recipe sanity linter
        run: python3 scripts/check_recipes.py

      - name: Doc-type collision check
        run: python3 scripts/check_doctype_collisions.py

      - name: Shared-asset drift check (closes #520)
        run: python3 scripts/sync-shared-assets.py --check

      - name: Guide-tree parity check (docs/guides vs plugin copy)
        run: python3 scripts/check-guide-parity.py --check

      - name: Doc-type registry references (recipes, commands, pages.md)
        run: python3 scripts/check-doc-type-registry.py

      - name: Guide site-link check (every guide reachable, no dead links)
        run: python3 scripts/check-guide-site-links.py

      - name: Contributor credit check (CHANGELOG credits vs contributors page)
        run: python3 scripts/check-contributor-credits.py

      - name: llms.txt sync check (every command indexed, no dead links)
        run: python3 scripts/check-llms-txt.py

      - name: Quality-checklist references resolve (closes #749)
        run: python3 scripts/check-quality-checklist-refs.py

      - name: DOC-CONTROL-HEADER markers have a command that resolves them (#760)
        run: python3 scripts/check-doc-control-resolution.py

      - name: common.sh / common.py parity (root vs plugin copies, #766)
        run: python3 scripts/check-common-parity.py --check

      - name: create-project.sh invocations are ones the script accepts (#775, #777)
        run: python3 scripts/check-create-project-invocations.py --check

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Dual-registration test for doc-types
        run: node scripts/tests/test-doc-types-dual-registration.mjs

      - name: Regime-registration test for doc-types
        run: node scripts/tests/test-regime-registration.mjs

      - name: ArcKit FDE template consistency
        run: node scripts/tests/test-fde-templates.mjs

      - name: Command-reference notation (colon namespace)
        run: python3 scripts/standardise-colon.py --check

      - name: Install npm deps for validator tests
        run: npm ci

      - name: Handoff schema validator tests (datascout)
        run: node tests/plugin/test_validate_handoff.mjs

      - name: Handoff schema validator tests (grants)
        run: node tests/plugin/test_validate_grants_handoff.mjs

      - name: Handoff schema validator tests (gov-reuse)
        run: node tests/plugin/test_validate_gov_reuse_handoff.mjs

      - name: Handoff schema validator tests (tenders)
        run: node tests/plugin/test_validate_tenders_handoff.mjs

      - name: Plugin hook test suites
        # Two naming conventions are in use, `*.test.mjs` and `test_*.mjs`, and
        # globbing only the first left EIGHT suites unrun -- 64 tests including
        # test_update_manifest.mjs, the docs/manifest.json coverage. That is the
        # same enumeration drift this step's previous comment claimed to have
        # solved, and the same class of gap as #719 (pytest running 52 of 1,445).
        # Glob both patterns rather than enumerating exceptions: the four handoff
        # validators are re-run here as well as in their own steps above, which
        # costs a second and cannot go stale.
        shell: bash
        run: node --test tests/plugin/*.test.mjs tests/plugin/test_*.mjs
