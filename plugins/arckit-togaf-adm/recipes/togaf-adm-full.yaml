schema: "1.0"
name: "togaf-adm-full"
description: "Full TOGAF ADM cycle — Preliminary through Phase H + Repository"
version: "1.0.0"
defaults:
  project_id: "001"
  version: "1.0"
targets:
  - id: foundation
    skill: "strategy"
    description: "Generate strategy and principles as ADM foundation"
  - id: adm-preliminary
    skill: "adm-preliminary"
    description: "Architecture Vision — ADM Preliminary"
    depends: ["foundation"]
  - id: business-capability-map
    skill: "business-capability-map"
    description: "Phase A — Business Architecture"
    depends: ["adm-preliminary"]
  - id: application-inventory
    skill: "application-inventory"
    description: "Phase C — Application portfolio"
    depends: ["adm-preliminary", "business-capability-map"]
  - id: application-rationalization
    skill: "application-rationalization"
    description: "Phase C — Portfolio decisions"
    depends: ["application-inventory", "business-capability-map"]
  - id: gap-analysis
    skill: "gap-analysis"
    description: "Phase E — Gap analysis"
    depends: ["business-capability-map", "application-inventory", "application-rationalization"]
  - id: transition-architecture
    skill: "transition-architecture"
    description: "Phase F — Migration planning"
    depends: ["gap-analysis"]
  - id: architecture-board
    skill: "architecture-board"
    description: "Phase G — Governance"
    depends: ["adm-preliminary"]
  - id: architecture-change
    skill: "architecture-change"
    description: "Phase H — Change management"
    depends: ["architecture-board"]
    optional: true
  - id: architecture-repository
    skill: "architecture-repository"
    description: "Repository — Cross-project synthesis"
    depends: ["foundation"]
    optional: true
postbuild:
  - "arckit:health"
  - "arckit:traceability"
