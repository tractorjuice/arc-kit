recipe: arc42-full
schema_version: 1
description: >
  arc42 architecture description: the core artefacts each arc42 section draws
  on (principles, stakeholders, requirements, decisions, data model, the four
  C4/runtime/deployment views, security, risks, glossary), the quality
  scenarios and crosscutting concepts for sections 10 and 8, then the arc42
  assembly that summarises and cites them. Optionally a technical debt
  register for section 11.2 and an SDD handover pack for Spec Kit.

defaults:
  version: "1.0"

optional_targets:
  SECD:
    description: Secure by Design assessment, the source for the security crosscutting concept (arc42 section 8)
    default: true
  DEBT:
    description: Technical debt register for arc42 section 11.2. Enable for an existing system; it consolidates debt from audits, assessments and reviews this recipe does not build
    default: false
  SDDH:
    description: SDD handover pack (constitution, feature briefs and plan inputs for Spec Kit), built from the arc42 description
    default: false
  # Evidence the description, concepts, debt register and handover read but this
  # recipe never needs to generate. Off by default, each is adopted when the
  # project already has one (arckit-build "Dep resolution"), so its dependents
  # read it; when none exists it is pruned, never built. --enable builds a new
  # one instead of reading the existing one.
  BKLG:
    description: Product backlog. An existing backlog is adopted so the SDD handover writes one brief per epic; --enable BKLG builds a new version instead
    default: false
  CDAU:
    description: Codebase audits in audits/. Existing audits are adopted as debt and as-built evidence; --enable CDAU audits this repository
    default: false
  CONF:
    description: Conformance assessment. An existing one is adopted for its known and untracked debt; --enable CONF builds a new version instead
    default: false
  HLDR:
    description: HLD review. An existing review is adopted for its conditions and findings; --enable HLDR reviews an available HLD
    default: false
  DLDR:
    description: DLD review. An existing review is adopted for its conditions and findings; --enable DLDR reviews an available DLD
    default: false
  PRIN-COMP:
    description: Principles compliance assessment. An existing one is adopted for its approved exceptions; --enable PRIN-COMP builds a new version instead
    default: false

post_build_hooks:
  - skill: arckit:health
    args: ""
  - skill: arckit:traceability
    args: ""

targets:
  - id: PRIN
    skill: arckit:principles
    args: ""
    output: { project: "000-global", type: PRIN }
    deps: []

  - id: STKE
    skill: arckit:stakeholders
    args: "{NAME}"
    output: { project: "{P}-{NAME}", type: STKE }
    deps: [PRIN]

  # /arckit:requirements reads the stakeholder analysis, so it runs after STKE.
  - id: REQ
    skill: arckit:requirements
    args: "{NAME}"
    output: { project: "{P}-{NAME}", type: REQ }
    deps: [PRIN, STKE]

  # arc42 section 4 (Solution Strategy) and 9 (Architecture Decisions).
  - id: ADR-001
    skill: arckit:adr
    topic: "Top-level decomposition and technology approach"
    args: "{P} {TOPIC}"
    output: { project: "{P}-{NAME}", type: ADR, subfolder: decisions, multi_instance: true }
    deps: [PRIN, REQ]

  - id: ADR-002
    skill: arckit:adr
    topic: "Deployment topology and hosting"
    args: "{P} {TOPIC}"
    output: { project: "{P}-{NAME}", type: ADR, subfolder: decisions, multi_instance: true }
    deps: [PRIN, REQ]

  # arc42 sections 5 and 8 (persistence and domain model).
  - id: DATA
    skill: arckit:data-model
    args: "{P}"
    output: { project: "{P}-{NAME}", type: DATA }
    deps: [REQ]

  # One diagram per arc42 view: 3 Context, 5 Building Blocks, 6 Runtime, 7 Deployment.
  - id: DIAG-CONTEXT
    skill: arckit:diagram
    topic: "C4 context"
    args: "{P} {TOPIC}"
    output: { project: "{P}-{NAME}", type: DIAG, subfolder: diagrams, multi_instance: true }
    deps: [REQ, STKE]

  - id: DIAG-CONTAINER
    skill: arckit:diagram
    topic: "C4 container"
    args: "{P} {TOPIC}"
    output: { project: "{P}-{NAME}", type: DIAG, subfolder: diagrams, multi_instance: true }
    deps: [REQ, ADR-001, DATA]

  - id: DIAG-SEQ
    skill: arckit:diagram
    topic: "sequence for the primary user journey"
    args: "{P} {TOPIC}"
    output: { project: "{P}-{NAME}", type: DIAG, subfolder: diagrams, multi_instance: true }
    deps: [REQ, ADR-001]

  - id: DIAG-DEP
    skill: arckit:diagram
    topic: "deployment"
    args: "{P} {TOPIC}"
    output: { project: "{P}-{NAME}", type: DIAG, subfolder: diagrams, multi_instance: true }
    deps: [REQ, ADR-002]

  - id: SECD
    skill: arckit:secure
    args: "{P}"
    output: { project: "{P}-{NAME}", type: SECD }
    deps: [PRIN, REQ, ADR-001]

  # arc42 section 11 (Risks and Technical Debt).
  - id: RISK
    skill: arckit:risk
    args: "{P}"
    output: { project: "{P}-{NAME}", type: RISK }
    deps: [REQ, STKE, "ADR-*", PRIN]

  # arc42 section 12. Runs late so it picks up terms from the design artefacts.
  - id: GLOS
    skill: arckit:glossary
    args: "{P}"
    output: { project: "{P}-{NAME}", type: GLOS }
    deps: [REQ, DATA, "ADR-*"]

  # Evidence targets (optional, adopted when they already exist; see optional_targets).
  - id: BKLG
    skill: arckit:backlog
    args: "{P}"
    output: { project: "{P}-{NAME}", type: BKLG }
    deps: [REQ, STKE]

  - id: HLDR
    skill: arckit:hld-review
    args: "{P}"
    output: { project: "{P}-{NAME}", type: HLDR, subfolder: reviews }
    deps: [PRIN, REQ, "ADR-*"]

  - id: DLDR
    skill: arckit:dld-review
    args: "{P}"
    output: { project: "{P}-{NAME}", type: DLDR, subfolder: reviews }
    deps: [HLDR, PRIN, REQ]

  - id: CDAU
    skill: arckit-repo:repo-audit
    args: "."
    output: { project: "{P}-{NAME}", type: CDAU, subfolder: audits, multi_instance: true }
    deps: [PRIN, REQ]

  - id: CONF
    skill: arckit:conformance
    args: "{P}"
    output: { project: "{P}-{NAME}", type: CONF }
    deps: [PRIN, REQ, "ADR-*", HLDR, DLDR, RISK]

  - id: PRIN-COMP
    skill: arckit:principles-compliance
    args: "{P}"
    output: { project: "{P}-{NAME}", type: PRIN-COMP }
    deps: [PRIN, REQ, "ADR-*"]

  # arc42 sections 1.2 and 10: the quality tree and scenarios.
  - id: QUAL
    skill: arckit-arc42:arc42-quality
    args: "{P}"
    output: { project: "{P}-{NAME}", type: QUAL }
    deps: [REQ, STKE, PRIN, "ADR-*"]

  # arc42 section 8. Reads the security assessment, the quality scenarios and,
  # when they exist, the design reviews and codebase audits.
  - id: CONC
    skill: arckit-arc42:arc42-concepts
    args: "{P}"
    output: { project: "{P}-{NAME}", type: CONC }
    deps: [REQ, PRIN, "ADR-*", DATA, SECD, QUAL, HLDR, DLDR, CDAU]

  # arc42 section 11.2. Optional (see optional_targets). Reads every recorded
  # debt source the project has: audits, conformance, reviews, exceptions.
  - id: DEBT
    skill: arckit-arc42:arc42-debt
    args: "{P}"
    output: { project: "{P}-{NAME}", type: DEBT }
    deps: [RISK, "ADR-*", "DIAG-*", CDAU, CONF, HLDR, DLDR, PRIN-COMP]

  - id: ARC42
    skill: arckit-arc42:arc42
    args: "{P}"
    output: { project: "{P}-{NAME}", type: ARC42 }
    deps: [PRIN, STKE, REQ, "ADR-*", DATA, "DIAG-*", SECD, RISK, GLOS, QUAL, CONC, DEBT, HLDR, DLDR, CDAU, CONF]

  # Handover to a Specification Driven Development tool. Optional (see optional_targets).
  - id: SDDH
    skill: arckit-arc42:arc42-handover
    args: "{P}"
    output: { project: "{P}-{NAME}", type: SDDH }
    deps: [ARC42, REQ, PRIN, STKE, "ADR-*", DATA, BKLG, QUAL, CONC, DEBT]
