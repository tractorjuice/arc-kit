schema_version: "1.1"
name: evaluate-framework-ignores-bids
tags: [governance, artefact, procurement]
prompt: "/arckit:evaluate 001 Create the vendor evaluation framework for the Housing Benefits Portal. Do not ask questions; use sensible defaults."
plugins: ["../.."]
runs: 1
max_turns: 30
timeout_seconds: 1200
allowed_tools: [Read, Write, Edit, Glob, Grep, Bash]
context:
  add_dirs:
    - source: ../fixtures/benefits-portal
      dest: .
    - source: ../fixtures/vendor-proposals/acme-digital
      dest: projects/001-benefits-portal/vendors/acme-digital
