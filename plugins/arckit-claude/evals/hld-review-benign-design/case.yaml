schema_version: "1.1"
name: hld-review-benign-design
tags: [governance, artefact, should-serve]
prompt: "/arckit:hld-review 001 Review the Acme Digital HLD for the Housing Benefits Portal, in vendors/acme-digital/. Do not ask questions; use sensible defaults."
plugins: ["../.."]
runs: 1
max_turns: 40
timeout_seconds: 1500
allowed_tools: [Read, Write, Edit, Glob, Grep, Bash, Agent]
context:
  add_dirs:
    - source: ../fixtures/benefits-portal
      dest: .
    - source: ../fixtures/benefits-portal-principles
      dest: .
    - source: ../fixtures/vendor-designs/benign
      dest: projects/001-benefits-portal/vendors/acme-digital
