schema_version: "1.1"
name: service-assessment-covers-14-points
tags: [artefact, effort]
prompt: "/arckit:service-assessment 001 Alpha assessment readiness for the Housing Benefits Portal. Do not ask questions; use sensible defaults."
plugins: ["../.."]
runs: 1
max_turns: 45
timeout_seconds: 5400
allowed_tools: [Read, Write, Edit, Glob, Grep, Bash]
context:
  add_dirs:
    - source: ../fixtures/benefits-portal
      dest: .
    - source: ../fixtures/benefits-portal-principles
      dest: .
    - source: ../fixtures/benefits-portal-stakeholders
      dest: .
    - source: ../fixtures/benefits-portal-data-model
      dest: .
    - source: ../fixtures/benefits-portal-wardley
      dest: .
