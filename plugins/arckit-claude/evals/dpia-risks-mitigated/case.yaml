schema_version: "1.1"
name: dpia-risks-mitigated
tags: [artefact, template-fields]
prompt: "/arckit:dpia 001 DPIA for the Housing Benefits Portal. Do not ask questions; use sensible defaults."
plugins: ["../.."]
runs: 1
max_turns: 40
timeout_seconds: 3600
allowed_tools: [Read, Write, Edit, Glob, Grep, Bash]
context:
  add_dirs:
    - source: ../fixtures/benefits-portal
      dest: .
    - source: ../fixtures/benefits-portal-principles
      dest: .
    - source: ../fixtures/benefits-portal-data-model
      dest: .
