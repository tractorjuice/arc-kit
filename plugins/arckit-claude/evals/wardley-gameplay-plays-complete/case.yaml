schema_version: "1.1"
name: wardley-gameplay-plays-complete
tags: [artefact, template-fields]
prompt: "/arckit:wardley.gameplay 001 Gameplay analysis for the Housing Benefits Portal map. Do not ask questions; use sensible defaults."
plugins: ["../.."]
runs: 1
max_turns: 45
timeout_seconds: 5400
allowed_tools: [Read, Write, Edit, Glob, Grep, Bash]
context:
  add_dirs:
    - source: ../fixtures/benefits-portal
      dest: .
    - source: ../fixtures/benefits-portal-principles
      dest: .
    - source: ../fixtures/benefits-portal-stakeholders
      dest: .
    - source: ../fixtures/benefits-portal-wardley
      dest: .
