# UK-Government well-architected rubric for arckit-{aws,azure,gcp}-research
#
# Same six pillars and the same inputs as cloud-research-generic,
# reweighted for UK public sector, and chosen by the orchestrator when
# the project's principles or requirements indicate a UK government
# context.
#
# What moves relative to cloud-research-generic, and why:
#
#   security               25 -> 30  The NCSC Cloud Security Principles and the
#                                    Technology Code of Practice make the security
#                                    posture an entry condition, and departments
#                                    cannot compensate for a weak one commercially.
#   reliability            20 -> 20  Unchanged.
#   sustainability         10 -> 15  The Greening Government ICT and Digital
#                                    Services Strategy makes carbon reporting a
#                                    reporting obligation, not a preference.
#   operational_excellence 15 -> 15  Unchanged.
#   performance_efficiency 15 -> 10  Departments size for known demand more often
#                                    than for elastic consumer traffic.
#   cost_optimisation      15 -> 10  Whole-life cost is appraised properly in the
#                                    Green Book Economic Case downstream; this
#                                    rubric only needs it to separate the
#                                    affordable from the absurd.
#
# Two additions rather than reweightings, both gates:
#
#   uk_region_required        A service with no UK region is not a cheaper option
#                             for OFFICIAL data, it is a different conversation
#                             about data residency. It gates, it does not score.
#   uk_assurance_expected     Cyber Essentials Plus and the NCSC Cloud Security
#                             Principles are the published assurances a department
#                             is expected to point at.
#
# Total possible weighted score: 100.

name: cloud-research-uk-gov
version: 1
weights:
  security: 30
  reliability: 20
  operational_excellence: 15
  sustainability: 15
  performance_efficiency: 10
  cost_optimisation: 10

scoring:
  security:
    method: signal_coverage
    field: evidence.architecture_signals
    expected:
      - encryption-at-rest
      - encryption-in-transit
      - iam-integration
      - private-networking
      - audit-logging
      - customer-managed-keys
    scale: 100
    # A service with no compliance programme evidence at all is capped:
    # a public sector buyer cannot rely on an assurance that is not
    # published, however good the architecture is.
    compliance_floor:
      field: evidence.compliance_programmes
      none_found_cap: 60
    when_missing: 30

  reliability:
    method: composite
    components:
      - name: resilience_signals
        method: signal_coverage
        field: evidence.architecture_signals
        expected: [multi-az-supported, multi-region-supported, managed-backups, point-in-time-restore]
        scale: 100
        when_missing: 30
        weight: 0.5
      - name: sla
        method: band
        field: evidence.sla_uptime_pct
        bands:
          - { min: 99.99, max: null,  score: 100 }
          - { min: 99.9,  max: 99.98, score: 85 }
          - { min: 99.0,  max: 99.89, score: 60 }
          - { min: 0,     max: 98.99, score: 30 }
        when_missing: 30
        weight: 0.3
      - name: lifecycle
        method: map
        field: evidence.lifecycle_status
        map:
          ga: 100
          preview: 30
          beta: 25
          alpha: 10
          deprecated: 5
          retired: 0
          unknown: 40
        when_missing: 40
        weight: 0.2

  operational_excellence:
    method: composite
    components:
      - name: iac
        method: set_non_empty
        field: evidence.iac_support
        excluding: [none-found]
        match_score: 100
        miss_score: 20
        when_missing: 40
        weight: 0.4
      - name: ops_signals
        method: signal_coverage
        field: evidence.architecture_signals
        expected: [observability-integration, managed-patching, infrastructure-as-code-supported]
        scale: 100
        when_missing: 30
        weight: 0.4
      - name: sdk_breadth
        method: band
        computed_field: sdk_language_count
        bands:
          - { min: 0, max: 1,    score: 25 }
          - { min: 2, max: 4,    score: 65 }
          - { min: 5, max: null, score: 100 }
        when_missing: 40
        weight: 0.2

  performance_efficiency:
    method: signal_coverage
    field: evidence.architecture_signals
    expected: [auto-scaling, edge-caching, global-load-balancing, multi-region-supported]
    scale: 100
    when_missing: 30

  cost_optimisation:
    method: composite
    components:
      - name: commitment_options
        method: signal_coverage
        field: evidence.architecture_signals
        expected: [reserved-pricing-available, serverless-billing, free-tier-available]
        scale: 100
        when_missing: 30
        weight: 0.5
      - name: price_transparency
        # A service with no published unit price cannot be cost-modelled
        # without a sales conversation, and that is a real cost of its own.
        method: band
        computed_field: published_price_count
        bands:
          - { min: 0, max: 0,    score: 20 }
          - { min: 1, max: 2,    score: 70 }
          - { min: 3, max: null, score: 100 }
        when_missing: 30
        weight: 0.5

  sustainability:
    method: signal_coverage
    field: evidence.architecture_signals
    expected: [carbon-reporting, serverless-billing, auto-scaling]
    scale: 100
    when_missing: 40

# Rendered star rating per pillar, so the existing template tables
# continue to work: stars = round(pillar_score / 20), clamped to 1-5.
rendering:
  stars_divisor: 20
  stars_min: 1
  stars_max: 5

# Region availability is a gate, not a score. A service unavailable in
# a region the project requires cannot be traded off against a strong
# security posture, so it is never averaged into the total.
gates:
  region_availability:
    field: regional_availability.status
    against: project_profile.required_regions
    blocking_values: [not-available]
    warning_values: [planned, unknown]
    on_blocking: exclude_from_recommendation_and_state_reason
  uk_region_required:
    field: regional_availability.region_code
    against: ["eu-west-2", "uksouth", "ukwest", "europe-west2"]
    require_status: available
    on_missing: flag_data_residency_decision
  uk_assurance_expected:
    field: evidence.compliance_programmes
    expected_any: ["cyber-essentials-plus", "uk-cloud-security-principles", "iso-27001"]
    on_missing: flag_for_assurance_review
