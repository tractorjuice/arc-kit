# ArcKit build recipe: UK food safety (Safer food, better business for caterers)
#
# Scope: a small catering business in England or Wales, building its food
# safety documents from the Food Standards Agency's Safer food, better business
# for caterers pack with the arckit-uk-food overlay. No ArcKit architecture
# documents: the overlay needs none.
#
# What a build can and cannot do. A build has nobody to answer, and only an
# answer a named person at the business gives can be confirmed. So a build
# confirms nothing: it makes the worksheets that are missing and writes
# each document from the answers already confirmed. On a new project every
# answer reads NOT YET ANSWERED. The answers come from running the commands
# with the person; the build writes each document from the answers confirmed
# so far. A build never signs anything off: /arckit-uk-food:uk-food-sign-off is
# not a target. For a document that is signed off and in step, the commands
# write nothing, inside a build too.
#
# The project must exist before a build. Running
# /arckit-uk-food:uk-food-profile once creates it.
#
# The build harness makes a git commit after each wave. A business's records
# folder is rarely a git repository: run the build with --no-commit then.
#
# No post-build step. ArcKit's health scan is written for architecture
# documents and may suggest promoting an old DRAFT; for these documents only
# /arckit-uk-food:uk-food-sign-off changes a document's status.
#
# This recipe passes the repository's recipe checks but has not yet been run
# end to end through the build harness.
#
# Every target writes `output:` on one line: check-doc-type-registry.py reads
# only the inline form, so a block-style `output:` would escape its check.

recipe: uk-food-sfbb
schema_version: 1
description: >
  UK food safety for a small catering business in England or Wales, from
  the Food Standards Agency's Safer food, better business for caterers pack:
  the business profile, the five sections of safe methods (cross-contamination,
  cleaning, chilling, cooking, management) and the completion record. A build
  has nobody to answer, so it confirms nothing: it makes the worksheets that
  are missing and writes draft documents from the answers a named person has
  already confirmed. On a new project every answer reads NOT YET ANSWERED. It does not
  sign anything off.

defaults:
  version: "1.0"

# Optional targets. default: true = built unless excluded with --exclude.
# default: false = built only with --enable.
optional_targets:
  OWN:
    description: >
      The business's own methods. Off by default: the build's worker check
      wants a document of more than 100 lines, and an own methods document is
      usually shorter, unless the business has many entries, so building it
      usually stops the build.
      Record the business's own methods with /arckit-uk-food:uk-food-own-methods;
      a build reads an own methods document that already exists.
    default: false

targets:

  # --- The profile first: the section documents take the business's name
  # from it, and each section command makes the profile worksheet if it is
  # missing, so it must exist before they run side by side.
  - id: PROFILE
    skill: arckit:uk-food-profile
    args: "{P}"
    output: { project: "{P}-{NAME}", type: FOODPROF }
    deps: []

  # --- The five sections of safe methods, side by side.
  - id: XC
    skill: arckit:uk-food-safe-methods
    args: "XC {P}"
    output: { project: "{P}-{NAME}", type: FOODXC }
    deps: [PROFILE]

  - id: CL
    skill: arckit:uk-food-safe-methods
    args: "CL {P}"
    output: { project: "{P}-{NAME}", type: FOODCLN }
    deps: [PROFILE]

  - id: CH
    skill: arckit:uk-food-safe-methods
    args: "CH {P}"
    output: { project: "{P}-{NAME}", type: FOODCHL }
    deps: [PROFILE]

  - id: CK
    skill: arckit:uk-food-safe-methods
    args: "CK {P}"
    output: { project: "{P}-{NAME}", type: FOODCOOK }
    deps: [PROFILE]

  - id: MG
    skill: arckit:uk-food-safe-methods
    args: "MG {P}"
    output: { project: "{P}-{NAME}", type: FOODMGT }
    deps: [PROFILE]

  # --- The business's own methods, after the sections (optional, see above).
  - id: OWN
    skill: arckit:uk-food-own-methods
    args: "{P}"
    output: { project: "{P}-{NAME}", type: FOODOWN }
    deps: [XC, CL, CH, CK, MG]

  # --- The completion record, last: it reports on every other document.
  - id: CHECK
    skill: arckit:uk-food-check
    args: "{P}"
    output: { project: "{P}-{NAME}", type: FOODCMP }
    deps: [PROFILE, XC, CL, CH, CK, MG, OWN]
