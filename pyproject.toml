[project]
name = "arckit-cli"
version = "6.11.0"
description = "ArcKit CLI - The Enterprise Architecture Governance Harness"
requires-python = ">=3.11"
dependencies = [
    "typer",
    "rich",
    "httpx[socks]",
    "platformdirs",
    "readchar",
    "truststore>=0.10.4",
]
authors = [{ name = "Your Name", email = "your.email@example.com" }]
readme = "README.md"
license = { text = "MIT" }
keywords = [
    "architecture",
    "enterprise",
    "governance",
    "procurement",
    "rfp",
    "vendor-selection",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Documentation",
    "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/tractorjuice/arc-kit"
Documentation = "https://github.com/tractorjuice/arc-kit/blob/main/README.md"
Repository = "https://github.com/tractorjuice/arc-kit"
Issues = "https://github.com/tractorjuice/arc-kit/issues"

[project.scripts]
arckit = "arckit_cli:main"

[tool.pytest.ini_options]
# Without this the collected set depends on whatever path a caller happens to
# type, which is the enumeration drift that hid the ungated Python suites
# (#719). Setting testpaths means a bare `python -m pytest` from the repo root
# collects exactly what CI collects.
#
# No `norecursedirs` entry is needed for tests/mermaid-wardley/node_modules:
# pytest's default norecursedirs already excludes node_modules, and the
# vendored katex Python files there are not named test_*.py, so they were
# never collected.
testpaths = ["tests"]

[build-system]
# pyyaml is a build dependency because hatch_build.py shells out to
# scripts/converter.py, which parses command frontmatter with yaml.
requires = ["hatchling", "pyyaml"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arckit_cli"]

# The extensions/ trees below are converter output and gitignored, so a build
# straight from a git checkout would package them empty. The hook regenerates
# them and fails the build if any are still missing (#730).
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel.shared-data]
"scripts" = "share/arckit/scripts"
# generate-document-id.mjs imports ../config/doc-types.mjs, so the registry
# ships too. Both keep their repo-relative paths under share/arckit so
# get_data_paths() resolves them identically in source and installed mode.
"plugins/arckit-claude/scripts/generate-document-id.mjs" = "share/arckit/plugins/arckit-claude/scripts/generate-document-id.mjs"
"plugins/arckit-claude/config" = "share/arckit/plugins/arckit-claude/config"
# csf-score.mjs (arc-kit#782) reads the calculator catalogue from a SIBLING
# plugin (arckit-eu), not from arckit-claude/config like doc-types.mjs, so
# both halves need their own entry. Both keep their repo-relative paths
# under share/arckit for the same reason as the pair above.
"plugins/arckit-claude/scripts/csf-score.mjs" = "share/arckit/plugins/arckit-claude/scripts/csf-score.mjs"
"plugins/arckit-eu/data" = "share/arckit/plugins/arckit-eu/data"
".arckit" = "share/arckit/.arckit"
# Distribute only the docs the CLI scaffolds (guides + the three named files),
# NOT the whole docs/ tree — mapping the directory shipped BUSINESS-PLAN.md,
# INVESTOR-REPORT.md, proposals/, articles/ and superpowers/ into the public
# package, and also double-mapped DEPENDENCY-MATRIX.md (breaking the wheel build).
"docs/guides" = "share/arckit/docs/guides"
"docs/README.md" = "share/arckit/docs/README.md"
"docs/DEPENDENCY-MATRIX.md" = "share/arckit/docs/DEPENDENCY-MATRIX.md"
"docs/WORKFLOW-DIAGRAMS.md" = "share/arckit/docs/WORKFLOW-DIAGRAMS.md"
"VERSION" = "share/arckit/VERSION"
"CHANGELOG.md" = "share/arckit/CHANGELOG.md"
"extensions/arckit-codex" = "share/arckit/extensions/arckit-codex"
"extensions/arckit-opencode" = "share/arckit/extensions/arckit-opencode"
"extensions/arckit-copilot" = "share/arckit/extensions/arckit-copilot"
"extensions/arckit-vibe" = "share/arckit/extensions/arckit-vibe"
