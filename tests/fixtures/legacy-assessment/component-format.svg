<text x="30" y="484" font-size="12">¹ Confidence = range precision: 100 × (1 − interval width / 3). High ≥80%, medium ≥50%, otherwise low.</text>
<text x="30" y="510" font-size="12">This is a local ArcKit plotting convention, not a probability, readiness percentage or published government score.</text>
<text x="30" y="536" font-size="12">Each criterion is calibrated at baseline=0, action-required=1 and legacy=2; the strongest indicator determines the component index.</text>
<text x="30" y="562" font-size="12">Missing indicators extend the upper bound to 3 and suppress the diamond. Labels retain exact bounds for narrow ranges.</text>
<text x="30" y="588" font-size="12">Recorded classifications remain separate. Raw measurements, calibration and evidence references are in the report.</text>
